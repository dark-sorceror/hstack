name: Documentation
on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/check-docs.mjs"
      - "package*.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/check-docs.mjs"
      - "package*.json"
      - ".github/workflows/docs.yml"
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - name: Build the documentation
        working-directory: docs
        run: npx --yes mint@4.2.1210 validate --telemetry=false
      - name: Check documentation links
        working-directory: docs
        run: npx --yes mint@4.2.1210 broken-links --telemetry=false
